remote_theme: krestfield/just-the-docs
# Plugins the theme needs (all supported by GitHub Pages)
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
title: Krestfield Knowledge
description: All product guides and documents
color_scheme: krestfield
logo: "/assets/images/krestfield.png"
search_enabled: true
search:
  # Index each ### heading as its own search result, so results link
  # straight to the relevant section (e.g. individual errors)
  heading_level: 3

# Sort pages without a nav_order alphabetically, ignoring case
nav_sort: case_insensitive
