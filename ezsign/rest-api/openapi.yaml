        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: |
        An API token issued by ezsign-manage (`users add-token`), sent as `Authorization: Bearer <token>`. Only the
        token's SHA-256 hash is stored by the server.
    clientCertificate:
      type: mutualTLS
      description: |
        A TLS client certificate issued by a CA in `server.restapi.tls.trustStore` and registered to a user
        (`users add-cert`). `server.restapi.tls.clientAuth` must be `optional` or `required`.

  parameters:
    Channel:
      name: channel
      in: path
      required: true
      description: |
        The channel name, as configured on the server (`channel.N.name`). Percent-encode any characters that are
        not allowed in a URL path, e.g. a space as `%20`. 1 to 128 characters, not containing `/`, `\`, `*` or
        control characters.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: SIGNING

  headers:
    TransactionId:
      description: The transaction ID of the request, also written to the server log
      schema:
        type: string
      example: '4963794784449164'

  responses:
    BadRequest:
      description: |
        The request is not valid (`INVALID_REQUEST`): the body is not a JSON object, a required field is missing,
        a field has the wrong type or is not valid base64, a certificate cannot be read, or the channel name is
        not valid
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_REQUEST
              message: data is required
    Unauthorized:
      description: |
        No credential was presented, or the API token or client certificate is not registered to an enabled user
        (`UNAUTHORIZED`). The server log gives the reason. The response has a `WWW-Authenticate: Bearer` header
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="ezsign"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: The API token was not recognised
    Forbidden:
      description: |
        The user does not hold the permission for the operation on the channel, or the client's address is not
        in `server.restapi.allowedSourceIpAddresses` (`FORBIDDEN`)
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: User finance-app does not have the sign permission on channel HR
    MethodNotAllowed:
      description: The wrong HTTP method was used (`METHOD_NOT_ALLOWED`). The `Allow` header gives the right one
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
        Allow:
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: Only GET is supported for this resource
    RequestTooLarge:
      description: The request body is larger than `server.restapi.maxRequestSize` (`REQUEST_TOO_LARGE`)
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: The request body exceeds the maximum size of 10485760 bytes
    UnsupportedMediaType:
      description: The `Content-Type` is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`)
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: The Content-Type must be application/json
    OperationFailed:
      description: |
        The operation failed (`OPERATION_FAILED`), e.g. the channel does not exist, is disabled or is the wrong
        type for the operation, or an unexpected error occurred (`INTERNAL_ERROR`)
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: OPERATION_FAILED
              message: The requested channel name of NOSUCH does not exist or has been disabled
    Busy:
      description: |
        All the EzSign instances are busy (`BUSY`). Retry the request later, or increase
        `server.restapi.threadPoolSize`
      headers:
        X-Transaction-Id:
          $ref: '#/components/headers/TransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BUSY
              message: All instances are busy and the total wait time of 1000ms has been exceeded

  schemas:
    Base64:
      type: string
      contentEncoding: base64
      description: Base64 encoded binary data

    SignRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Base64'
          description: The data to sign, or its hash if `isDigest` is `true`
        isDigest:
          type: boolean
          default: false
          description: Whether `data` is a hash of the data rather than the data itself

    SignResponse:
      type: object
      required: [signature]
      properties:
        signature:
          $ref: '#/components/schemas/Base64'
          description: The signature (PKCS#7 or raw, as configured for the channel)

    VerifyRequest:
      type: object
      required: [signature]
      properties:
        signature:
          $ref: '#/components/schemas/Base64'
          description: The signature to verify
        content:
          $ref: '#/components/schemas/Base64'
          description: |
            The signed data, or its hash if `isDigest` is `true`. Required for a raw signature and for a detached
            PKCS#7 signature
        isDigest:
          type: boolean
          default: false
          description: Whether `content` is a hash of the data rather than the data itself
        signatureType:
          type: string
          enum: [pkcs7, raw]
          default: pkcs7
          description: The type of signature
        signerCert:
          $ref: '#/components/schemas/Base64'
          description: The signer's certificate (base64 DER). Required when `signatureType` is `raw`
        otherCerts:
          type: array
          items:
            $ref: '#/components/schemas/Base64'
          description: |
            Other certificates in the signer's path (base64 DER) that are not held by the channel. Raw signatures
            only
        bypassRevocationCheck:
          type: boolean
          default: false
          description: Skip the revocation check. Requires the `verify.bypass` permission
        bypassPathBuild:
          type: boolean
          default: false
          description: Skip building and validating the certificate path. Requires the `verify.bypass` permission

    VerifyResponse:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
          const: true

    VerifyFailedResponse:
      type: object
      required: [verified, error]
      properties:
        verified:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'

    EncipherRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Base64'
          description: The data to encrypt, or the data returned by `encrypt` to decrypt
        keyLabel:
          type: string
          description: The label of the AES key. If omitted, the channel's default key (`channel.N.defaultKeyLabel`) is used

    RandomRequest:
      type: object
      required: [numBytes]
      properties:
        numBytes:
          type: integer
          minimum: 1
          maximum: 65536
          description: The number of random bytes to generate

    DataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Base64'

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    WhoAmIResponse:
      type: object
      required: [id, authMethod, permissions]
      properties:
        id:
          type: string
          description: The user id
        authMethod:
          type: string
          enum: [apiToken, certificate]
          description: How the user authenticated
        permissions:
          type: array
          items:
            type: string
          description: The user's permissions, from their roles

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - REQUEST_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - VERIFICATION_FAILED
            - PATH_VALIDATION_FAILED
            - REVOCATION_CHECK_FAILED
            - ENCRYPTION_FAILED
            - DECRYPTION_FAILED
            - SIGNING_FAILED
            - OPERATION_FAILED
            - INTERNAL_ERROR
            - BUSY
          description: The error code. See the table in the introduction
        message:
          type: string
          description: A description of the error

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    StatusResponse:
      type: object
      properties:
        serverStatus:
          type: string
          enum: [running, stopped]
          description: Whether the server's interfaces are running
        serverVersion:
          type: string
        serverHostName:
          type: [string, 'null']
        serverIpAddress:
          type: [string, 'null']
        processId:
          type: string
          description: The process ID and host, as reported by Java (pid@host)
        propertiesFile:
          type: string
          description: The server properties file
        serverStartTime:
          type: string
          description: When the server started (yyyy-MM-dd HH:mm:ss)
        serverUptime:
          type: string
          description: The time since the server started, e.g. "3 hours, 25 minutes"
        serverUptimeSeconds:
          type: integer
        lastReloadTime:
          type: [string, 'null']
          description: When the configuration was last reloaded, or null if it has not been
        serverTime:
          type: string
          description: The server's current time
        javaVersion:
          type: string
        javaVendor:
          type: string
        osName:
          type: string
        heapUsedMB:
          type: integer
        heapMaxMB:
          type: [integer, 'null']
        threads:
          type: integer
        totalCalls:
          type: integer
          description: Operations called on both interfaces since the server started
        totalSuccess:
          type: integer
        totalFailures:
          type: integer
        callsPerSecond:
          type: number
          description: The average since the server started
        callsLastMinute:
          type: integer
        callsPerSecondLastMinute:
          type: number
        unknownChannelCalls:
          type: integer
          description: Calls naming a channel that does not exist
        interfaces:
          type: object
          properties:
            socket:
              $ref: '#/components/schemas/SocketInterfaceStatus'
            rest:
              $ref: '#/components/schemas/RestInterfaceStatus'
        channels:
          type: object
          description: The channels in the properties file, by name
          additionalProperties:
            $ref: '#/components/schemas/ChannelStatus'

    InterfaceStatus:
      type: object
      properties:
        enabled:
          type: boolean
        running:
          type: boolean
        port:
          type: integer
        bindAddress:
          type: string
          description: The address the interface listens on, or ALL when no bind address is set
        tls:
          type: boolean
        instances:
          type: integer
          description: The number of EzSign instances serving the interface
        busyInstances:
          type: integer
        calls:
          type: integer
          description: Operations called on the interface
        success:
          type: integer
        failures:
          type: integer
        busy:
          type: integer
          description: Requests refused because all instances were busy

    SocketInterfaceStatus:
      allOf:
        - $ref: '#/components/schemas/InterfaceStatus'
        - type: object
          properties:
            refusedAddress:
              type: integer
              description: Connections refused because the address is not in server.allowedSourceIpAddresses

    RestInterfaceStatus:
      allOf:
        - $ref: '#/components/schemas/InterfaceStatus'
        - type: object
          properties:
            clientCertificates:
              type: [string, 'null']
              enum: [none, optional, required, null]
              description: server.restapi.tls.clientAuth, or null without TLS
            usersFile:
              type: object
              properties:
                version:
                  type: integer
                users:
                  type: integer
                signatureRequired:
                  type: boolean
            requests:
              type: integer
              description: Every REST request, including health and status checks and refused requests
            unauthorised:
              type: integer
            forbidden:
              type: integer
            badRequests:
              type: integer

    ChannelStatus:
      type: object
      description: |
        The channel's type, whether it is enabled, and for each operation `<op>Calls`, `<op>Success`,
        `<op>Failures` and `<op>AverageMs`, where `<op>` is `sign`, `verify`, `encrypt`, `decrypt` or `random`.
        The operations for the channel's type are always shown (PKI: sign, verify and random; SYM: encrypt,
        decrypt and random), plus any other operation that has been called on it.
      properties:
        type:
          type: string
          enum: [PKI, SYM]
          description: The channel type. A channel with no type configured is a PKI channel
        enabled:
          type: boolean
        lastCallTime:
          type: [string, 'null']
      additionalProperties:
        type: number
